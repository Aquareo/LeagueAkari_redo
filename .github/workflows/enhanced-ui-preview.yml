name: Enhanced UI Preview

on:
  pull_request:
    branches: [dev, 'feat/clean-ui-v2']
  push:
    branches:
      - 'feat/akari-enhanced-ui-*'
      - 'feat/workspace-dashboard-*'
      - 'feat/fresh-top-counter-*'
      - 'feat/live-matchup-stats-*'
      - 'feat/clean-ui-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enhanced-ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-preview:
    name: Validate and package Windows preview
    runs-on: windows-2022
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Typecheck
        run: yarn typecheck
      - name: Unit tests
        run: yarn test
      - name: Package Windows
        run: yarn build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload preview installer
        uses: actions/upload-artifact@v4
        with:
          name: league-akari-enhanced-windows-preview
          path: |
            dist/*.exe
            dist/*.7z
          if-no-files-found: error
          retention-days: 7
